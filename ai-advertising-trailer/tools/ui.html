<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:1920px;height:1080px;background:#0b0b0d;color:#eee;font-family:Inter,sans-serif;overflow:hidden}
.top{height:64px;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 32px;gap:14px;font-weight:600;font-size:20px}
.dot{width:12px;height:12px;border-radius:50%;background:#ff6a00}.tag{margin-left:auto;font-size:14px;color:#888;font-weight:500}
.wrap{display:flex;height:1016px}.left{width:640px;padding:40px;border-right:1px solid #222}
label{font-size:14px;letter-spacing:.12em;color:#888;text-transform:uppercase}
.box{margin-top:14px;height:300px;background:#141418;border:1px solid #2a2a30;border-radius:16px;padding:24px;font-size:28px;line-height:1.45;color:#fff}
.cur{display:inline-block;width:3px;height:32px;background:#ff6a00;vertical-align:-5px;animation:b .8s steps(1) infinite}@keyframes b{50%{opacity:0}}
.opts{display:flex;gap:10px;margin-top:22px}.opt{padding:10px 16px;border:1px solid #2a2a30;border-radius:999px;font-size:16px;color:#bbb}.opt.on{border-color:#ff6a00;color:#ff6a00}
.btn{margin-top:30px;height:76px;border-radius:14px;background:#ff6a00;color:#111;font-weight:700;font-size:26px;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.btn.press{transform:scale(.96);filter:brightness(1.2)}
.bar{margin-top:26px;height:6px;background:#222;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6a00,#ffd000)}
.st{margin-top:12px;font-size:16px;color:#888}
.right{flex:1;padding:40px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cell{border-radius:16px;background:#141418;overflow:hidden;position:relative}
.cell img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);filter:blur(30px);transition:all .9s cubic-bezier(.2,.7,.2,1)}
.cell.on img{opacity:1;transform:scale(1);filter:blur(0)}
.cell .sh{position:absolute;inset:0;background:linear-gradient(100deg,#141418 30%,#22222a 50%,#141418 70%);background-size:200% 100%;animation:sh 1.2s infinite linear}@keyframes sh{to{background-position:-200% 0}}
.cell.on .sh{display:none}
</style></head><body>
<div class="top"><div class="dot"></div>AI Ad Studio<span class="tag">Project: monday. Orange Juice — Launch Campaign</span></div>
<div class="wrap"><div class="left"><label>Prompt</label><div class="box"><span id="t"></span><span class="cur"></span></div>
<div class="opts"><span class="opt on">Packshot</span><span class="opt">Lifestyle</span><span class="opt on">4:5</span><span class="opt">9:16</span><span class="opt on">x4</span></div>
<div class="btn" id="g">Generate ✦</div><div class="bar"><i id="p"></i></div><div class="st" id="s">Ready</div></div>
<div class="right"><div class="cell"><div class="sh"></div><img src="a.png"></div><div class="cell"><div class="sh"></div><img src="b.png"></div><div class="cell"><div class="sh"></div><img src="c.png"></div><div class="cell"><div class="sh"></div><img src="d.png"></div></div></div>
<script>
const txt="monday. orange juice bottle, studio packshot, soft morning light, fresh oranges, linen, label sharp, premium ad";
let i=0;const T=document.getElementById('t');
setTimeout(function ty(){T.textContent=txt.slice(0,++i);if(i<txt.length)setTimeout(ty,22+Math.random()*25);else go()},400);
function go(){setTimeout(()=>{const g=document.getElementById('g');g.classList.add('press');setTimeout(()=>g.classList.remove('press'),180);
 document.getElementById('s').textContent='Generating 4 variations…';let w=0;const P=document.getElementById('p');
 const iv=setInterval(()=>{w+=4;P.style.width=w+'%';if(w>=100){clearInterval(iv);document.getElementById('s').textContent='Done · 4 images · 9.8s'}},40);
 document.querySelectorAll('.cell').forEach((c,k)=>setTimeout(()=>c.classList.add('on'),900+k*260));},300)}
</script></body></html>
