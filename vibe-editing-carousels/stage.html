  @font-face { font-family: InterL; src: url(assets/fonts/Inter-Regular.otf); font-weight: 400; }
  @font-face { font-family: InterD; src: url(assets/fonts/InterDisplay-Light.otf); font-weight: 300; }

  @font-face { font-family: VT323; src: url(assets/fonts/VT323.ttf); font-weight: 400; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1350"></canvas>
<script>
  // ?c=01-five-step-system&s=3  -> carousel file and slide number
  const q = new URLSearchParams(location.search);
  // Carousel 01 runs on lib/stage.js; carousels that set `kit: true` run on lib/kit.js.
  const files = ["lib/util.js", "lib/footage.js", "lib/hands.js", "lib/cards.js", "lib/kit.js",
    `carousels/${q.get("c") || "01-five-step-system"}.js`];
  const load = (f) => new Promise((ok, no) => {
    const s = document.createElement("script"); s.src = f; s.onload = ok; s.onerror = () => no(new Error(f));
    document.body.appendChild(s);
  });
  window.stageReady = files.reduce((p, f) => p.then(() => load(f)), Promise.resolve())
    .then(() => (window.CAROUSEL.kit ? K.start() : load("lib/stage.js").then(() => window.stageReady)));
</script>
</body>
</html>
