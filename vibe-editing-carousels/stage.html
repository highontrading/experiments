<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Vibe Editing carousel stage</title>
<style>
  @font-face { font-family: ArchX; src: url(assets/fonts/Archivo-Expanded-800.ttf); font-weight: 800; }
  @font-face { font-family: ArchX9; src: url(assets/fonts/Archivo-Expanded-900.ttf); font-weight: 900; }
  @font-face { font-family: InterL; src: url(assets/fonts/Inter-Medium.otf); font-weight: 500; }
  @font-face { font-family: InterL; src: url(assets/fonts/Inter-SemiBold.otf); font-weight: 600; }
  @font-face { font-family: InterL; src: url(assets/fonts/Inter-Bold.otf); font-weight: 700; }
  @font-face { font-family: InterL; src: url(assets/fonts/Inter-ExtraBold.otf); font-weight: 800; }
  @font-face { font-family: Caveat; src: url(assets/fonts/Caveat-600.ttf); font-weight: 600; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1350"></canvas>
<script>
  // ?c=01-five-step-system&s=3  -> carousel file and slide number
  const q = new URLSearchParams(location.search);
  const files = ["lib/util.js", "lib/footage.js", "lib/hands.js", "lib/cards.js",
    `carousels/${q.get("c") || "01-five-step-system"}.js`, "lib/stage.js"];
  window.stageReady = files.reduce((p, f) => p.then(() => new Promise((ok, no) => {
    const s = document.createElement("script"); s.src = f; s.onload = ok; s.onerror = () => no(new Error(f));
    document.body.appendChild(s);
  })), Promise.resolve()).then(() => window.stageReady);
</script>
</body>
</html>
