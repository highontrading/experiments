<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Vibe Editing Film</title>
<style>
  :root {
    --bg: #0b0910; --panel: #17141f; --panel2: #1e1a29; --line: rgba(255,255,255,.08);
    --text: #ece8f6; --muted: #8d87a3; --violet: #8b5cf6; --violet2: #a78bfa;
    --yellow: #ffc93c; --orange: #ff8a3d; --teal: #22d3ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #07060a; }
  body { font-family: "Inter", sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }

  #bg { position: absolute; inset: 0;
    background:
      radial-gradient(1200px 700px at 50% 62%, rgba(139,92,246,.20), transparent 70%),
      radial-gradient(900px 500px at 20% 20%, rgba(255,138,61,.08), transparent 70%),
      radial-gradient(1600px 900px at 50% 50%, #15111c 0%, #08070b 70%); }
  .bokeh { position: absolute; border-radius: 50%; filter: blur(14px); }

  #cam { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 960px 540px; }
  #world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform-origin: 0 0; transform-style: preserve-3d; }
  #floor { position: absolute; left: -1540px; top: -1000px; width: 5000px; height: 3080px;
    transform: translateZ(-90px);
    background:
      radial-gradient(1300px 800px at 50% 50%, rgba(139,92,246,.16), transparent 70%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 80px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 80px);
    -webkit-mask-image: radial-gradient(closest-side, #000 40%, transparent 100%); }

  .slab { position: absolute; transform-style: preserve-3d; }
  .base { position: absolute; inset: 0; border-radius: 16px; background: #0c0a11;
    box-shadow: 0 40px 80px rgba(0,0,0,.65); }
  .face { position: absolute; inset: 0; border-radius: 16px; overflow: hidden;
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--line);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 1px rgba(0,0,0,.4); }
  .face .off { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  .face .scan { position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1px;
    background: #fff; box-shadow: 0 0 24px #fff, 0 0 60px var(--violet2); opacity: 0; }
  .face .gloss { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,.06), transparent 35%); }

  .ph { position: absolute; left: 0; right: 0; top: 0; height: 32px; display: flex; align-items: center;
    padding: 0 14px; gap: 10px; font-size: 11px; font-weight: 700; letter-spacing: .12em;
    color: var(--muted); border-bottom: 1px solid var(--line); }
  .ph .sp { flex: 1; }
  .ph .tag { font-weight: 600; letter-spacing: .02em; color: #6f6984; }
  .abs { position: absolute; }

  /* topbar */
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: .04em; }
  .logo small { font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: .02em; }
  .bulb { width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6c4, var(--yellow) 45%, #f59e0b);
    box-shadow: 0 0 14px rgba(255,201,60,.7); }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 14px;
    border-radius: 9px; font-size: 13px; font-weight: 600; background: #26213a; border: 1px solid var(--line); }
  .pill.pri { background: var(--violet); border-color: transparent; box-shadow: 0 0 20px rgba(139,92,246,.5); }
  .menu { display: flex; gap: 22px; font-size: 13px; color: #b8b2cc; font-weight: 500; }
  .av { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #17141f; }

  /* media */
  .thumb { position: absolute; width: 152px; height: 86px; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--line); background: #000; }
  .thumb canvas { width: 152px; height: 86px; display: block; }
  .tlabel { position: absolute; font-size: 11px; color: #b8b2cc; font-weight: 500; }
  .tlabel b { color: var(--muted); font-weight: 500; float: right; }
  .sec { position: absolute; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
  .look { position: absolute; border-radius: 9px; display: flex; align-items: center; gap: 8px;
    padding: 0 10px; font-size: 12.5px; font-weight: 600; background: #221d31; border: 1px solid var(--line); }
  .sw { width: 22px; height: 22px; border-radius: 6px; flex: none; }

  /* preview */
  #comp { position: absolute; border-radius: 6px; background: #000; box-shadow: 0 0 0 1px rgba(255,255,255,.06); }
  .transport { position: absolute; display: flex; align-items: center; gap: 14px; font-size: 13px; color: #b8b2cc; }
  .tc { font-family: "DejaVu Sans Mono", monospace; font-size: 15px; color: var(--text); letter-spacing: .02em; }
  .bar { height: 4px; border-radius: 2px; background: #2a2538; position: relative; flex: 1; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--violet); }

  /* copilot */
  .prompt { position: absolute; border-radius: 12px; background: #0f0d16; border: 1px solid rgba(139,92,246,.45);
    box-shadow: 0 0 0 4px rgba(139,92,246,.10); padding: 14px 16px; font-size: 16px; line-height: 1.45; font-weight: 500; }
  .caret { display: inline-block; width: 2px; height: 19px; background: var(--violet2); vertical-align: -3px; margin-left: 1px; }
  .chip { position: absolute; border-radius: 11px; display: flex; align-items: center; gap: 10px; padding: 0 14px;
    font-size: 15px; font-weight: 650; background: #241f35; border: 1px solid var(--line); }
  .chip .ic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
    font-size: 14px; background: #322b4a; color: var(--violet2); }
  .chip .ok { margin-left: auto; font-size: 14px; color: var(--yellow); opacity: 0; }
  .log { position: absolute; font-size: 13px; line-height: 23px; color: #b8b2cc; }
  .log div { white-space: nowrap; }
  .log span { color: var(--yellow); margin-right: 6px; }
  #vibebtn { position: absolute; border-radius: 16px; display: flex; flex-direction: column; justify-content: center;
    padding-left: 26px; font-weight: 800; font-size: 26px; letter-spacing: .06em;
    background: linear-gradient(100deg, #7c3aed, #8b5cf6 45%, #c084fc);
    box-shadow: 0 0 34px rgba(139,92,246,.55), inset 0 1px 0 rgba(255,255,255,.3); }
  #vibebtn small { font-size: 13px; font-weight: 500; letter-spacing: .02em; opacity: .85; margin-top: 2px; }

  /* timeline */
  .ruler { position: absolute; height: 30px; border-bottom: 1px solid var(--line); }
  .tick { position: absolute; bottom: 0; width: 1px; background: #4a4460; }
  .tnum { position: absolute; top: 2px; font-size: 11px; color: var(--muted); font-family: "DejaVu Sans Mono", monospace; }
  .row { position: absolute; border-radius: 8px; background: rgba(255,255,255,.025); }
  .trk { position: absolute; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700;
    letter-spacing: .08em; color: #b8b2cc; }
  .trk i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .trk em { font-style: normal; font-weight: 500; letter-spacing: 0; color: var(--muted); font-size: 11px; }
  .clip { position: absolute; border-radius: 7px; overflow: hidden; font-size: 11.5px; font-weight: 650;
    padding: 5px 8px; color: #fff; white-space: nowrap; border: 1px solid rgba(255,255,255,.18); }
  .clip canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; }
  .clip span { position: relative; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  .clip .lut { position: absolute; left: 0; right: 0; top: 0; height: 4px;
    background: linear-gradient(90deg, var(--teal), var(--orange)); }
  #playhead { position: absolute; width: 2px; background: var(--yellow); box-shadow: 0 0 10px rgba(255,201,60,.8); }
  #phandle { position: absolute; width: 30px; height: 22px; border-radius: 5px 5px 2px 2px; background: var(--yellow);
    box-shadow: 0 0 16px rgba(255,201,60,.8); }
  #phandle:after { content: ""; position: absolute; left: 8px; bottom: -7px; border: 7px solid transparent;
    border-top-color: var(--yellow); border-bottom: 0; }

  #lutcard { position: absolute; left: 0; top: 0; width: 170px; height: 64px; border-radius: 14px; display: flex;
    align-items: center; gap: 10px; padding: 0 12px; font-weight: 800; font-size: 15px; letter-spacing: .04em;
    background: #241f35; border: 1px solid rgba(255,255,255,.25);
    box-shadow: 0 0 30px rgba(34,211,238,.45), 0 0 50px rgba(255,138,61,.35); }
  #lutcard .sw { width: 38px; height: 38px; border-radius: 9px; }

  .shard { position: absolute; left: 0; top: 0; background: linear-gradient(135deg, rgba(220,230,255,.55), rgba(160,140,255,.15));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.6); }
  .pt { position: absolute; left: 0; top: 0; border-radius: 50%; }
  #shadow { position: absolute; left: 0; top: 0; width: 120px; height: 40px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,0,0,.7), transparent); }
  #bro { position: absolute; left: 0; top: 0; width: 200px; height: 200px; transform-origin: 100px 192px; }
  #bro canvas { width: 200px; height: 200px; display: block; }

  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; mix-blend-mode: screen; }
  #vig { position: absolute; inset: 0; background: radial-gradient(130% 120% at 50% 50%, transparent 55%, rgba(0,0,0,.55)); }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="cam"><div id="world"><div id="floor"></div></div></div>
<div id="flash"></div>
<div id="vig"></div>
<div id="fade"></div>
<script src="build/timeline.js"></script>
<script src="stage.js"></script>
</body>
</html>
