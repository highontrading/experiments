/* ============ MOTION KIT: everything below is a pure function of time ============ */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  inOut: (x) => -(Math.cos(Math.PI * x) - 1) / 2,
  out3: (x) => 1 - Math.pow(1 - x, 3),
  in2: (x) => x * x,
  back: (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
};
const settle = (t, t0, amp = 1, freq = 3, damp = 6) =>
  t < t0 ? 0 : amp * Math.exp(-damp * (t - t0)) * Math.cos(2 * Math.PI * freq * (t - t0));
const hop = (t, t0, h, dur) => { const x = (t - t0) / dur; return x <= 0 || x >= 1 ? 0 : 4 * h * x * (1 - x); };
let seed = 7; const rng = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const loopSin = (t, n = 1, phase = 0) => Math.sin(2 * Math.PI * (n * t / LOOP + phase));
const V = (x, y, z) => new THREE.Vector3(x, y, z);

/* ============ RENDERER, LIGHT RIG ============ */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);

const PAL = { bg: '#1b2029', hero: '#ece4d8', accent: '#f0a53a' };

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.bg);
scene.fog = new THREE.Fog(PAL.bg, 12, 22);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 60);

// night studio: warm key from upper left front, cool dim fill, cool rim from behind right
const key = new THREE.DirectionalLight('#ffe4c2', 3.2);
key.position.set(-5, 7.5, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 5;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 2, far: 22 });
scene.add(key);
scene.add(new THREE.HemisphereLight('#8ea4c8', '#140f0b', 0.45));
const rim = new THREE.DirectionalLight('#d6e4ff', 4);
rim.position.set(3.5, 4, -6);
scene.add(rim);
// a soft pool of warm light on the back wall, for separation
const wash = new THREE.SpotLight('#ffcf9a', 60, 0, 0.55, 1, 2);
wash.position.set(1.2, 6, -1.5); wash.target.position.set(0.6, 1.6, -4.5);
scene.add(wash, wash.target);

/* ============ SET ============ */
// walnut desk, grain drawn once at build time
function woodTexture() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#3a291e'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 420; i++) {
    const y = rng() * 1024, a = 0.03 + rng() * 0.09, w = 1 + rng() * 4, light = rng() > 0.5;
    g.strokeStyle = light ? `rgba(120,84,58,${a})` : `rgba(18,11,7,${a * 1.4})`;
    g.lineWidth = w; g.beginPath();

/* ============ render(t): set EVERYTHING from t alone ============ */
const camPos = V(0, 0, 0), aim = V(0, 0, 0), tmp = V(0, 0, 0);
function render(t) {
  t = ((t % LOOP) + LOOP) % LOOP;

  // ---- orb: fall, bounce, anticipate, roll, hit, rebound; return 9.15..10
  const fall = E.in2(seg(t, 0, 0.75));
  const p = START.clone().lerp(LAND, fall);
  p.y = lerp(START.y, R, fall) + hop(t, 0.75, 0.42, 0.5) + hop(t, 1.25, 0.12, 0.27) + hop(t, 1.52, 0.03, 0.14);
  const back = 0.09 * E.inOut(seg(t, 1.72, 1.95)) * (1 - seg(t, 1.95, 2.1));
  const rollK = seg(t, 1.95, 2.55), roll = lerp(E.inOut(rollK), E.in2(rollK), 0.45);   // still speeding up at contact
  const reb = 0.06 * Math.sin(Math.PI * seg(t, 2.55, 2.95));                        // bounces off the phone a touch
  p.addScaledVector(U, -back).add(HIT.clone().sub(LAND).setY(0).multiplyScalar(roll)).addScaledVector(U, -reb);
  const ret = seg(t, 9.15, 10);
  if (ret > 0) { const from = p.clone(); p.lerpVectors(from, START, E.inOut(ret)); p.y = lerp(from.y, START.y, E.in2(ret)); }
  orb.position.copy(p);
  let sq = 0.07 * Math.max(0, settle(t, 0.75, 1, 4, 11)) + 0.04 * Math.max(0, settle(t, 1.25, 1, 4, 12));
  if (t < 0.75) sq -= 0.05 * fall;
  const s = 1 - sq; orb.scale.set(1 / Math.sqrt(s), s, 1 / Math.sqrt(s));
  const dist = p.clone().sub(LAND).setY(0).dot(U);                                    // rolling: angle = distance / radius
  qa.setFromAxisAngle(AXIS, dist / R);
  qb.setFromAxisAngle(V(0.3, 1, 0.2).normalize(), 0.6 * (1 - fall) + 0.6 * ret);      // a little tumble in the air
  spin.quaternion.copy(qa).multiply(qb);
  // AI core: breathes, flares on contact, glows through the change
  const hitPulse = Math.max(0, settle(t, 2.55, 1, 1.2, 4.5));
  const live = E.out3(seg(t, 2.55, 2.9)) * (1 - E.inOut(seg(t, 9.0, 9.6)));
  coreM.emissiveIntensity = 2.6 + 0.3 * loopSin(t, 5) + 5 * hitPulse + 1.2 * live;
  orbLight.intensity = 0.7 + 2.5 * hitPulse + 0.6 * live;
  pool.position.set(p.x, 0.004, p.z);
  pool.material.opacity = 0.32 * clamp(1 - (p.y - R) / 1.6) * (1 + 1.5 * hitPulse);
  pool.scale.setScalar(1 + 0.6 * clamp((p.y - R) / 1.6));

  // ---- screen: the grey ad is wiped into the personal one, starting where the orb touched
  const wipe = E.inOut(seg(t, 2.6, 3.4)) * (1 - E.inOut(seg(t, 9.0, 9.6)));
  const ctr = lerp(0.4, 4.1, E.out3(seg(t, 3.6, 4.6)));
  drawScreen(wipe, ctr, 0.8 * Math.max(0, settle(t, 3.4, 1, 1.5, 6)) * (t > 3.4 ? 1 : 0));
  screenM.emissiveIntensity = lerp(0.5, 0.62, wipe);
  phone.rotation.x = -0.2 + 0.012 * settle(t, 2.55, 1, 4, 8);                           // the knock

  // ---- bars: grow staggered with overshoot, breathe, shrink back
  bars.forEach((b, i) => {
    const t0 = 3.7 + i * 0.15;
    const grow = E.back(seg(t, t0, t0 + 0.5), 1.6) * (1 - E.inOut(seg(t, 9.0 + i * 0.08, 9.5 + i * 0.08)));
    const h = lerp(BAR_MIN, BAR_H[i], grow) * (1 + 0.01 * loopSin(t, 4, i * 0.2));
    b.scale.set(1, h, 1);
  });
  bars[2].material.emissiveIntensity = 0.35 * E.out3(seg(t, 4.0, 4.5)) * (1 - E.inOut(seg(t, 9.0, 9.5)));

  // ---- camera: push in, then pull out and rise to make room for the words, drift, return
  const C0 = V(0.0, 1.2, 9.6), C1 = V(0.05, 1.32, 8.6), C2 = V(0.4, 2.35, 10.9), C3 = V(0.58, 2.42, 10.7);
  const L0 = V(0.12, 1.25, 0.5), L1 = V(0.12, 1.05, 0.4), L2 = V(0.42, 1.45, 0), L3 = V(0.5, 1.47, 0);
  const a = E.inOut(seg(t, 0, 4.3)), b = E.inOut(seg(t, 4.3, 5.7)), c = E.inOut(seg(t, 5.7, 8.8)), d = E.inOut(seg(t, 8.8, 10));
  camPos.copy(C0).lerp(C1, a).lerp(C2, b).lerp(C3, c).lerp(C0, d);
  aim.copy(L0).lerp(L1, a).lerp(L2, b).lerp(L3, c).lerp(L0, d);
  // the aim leans toward the orb while it is the action, arriving late
  const follow = 0.25 * (1 - b) * (1 - d);
  const lag = E.inOut(seg(t, 0.2, 1.2)); aim.x += follow * (p.x - aim.x) * lag; aim.y += 0.15 * (1 - b) * (1 - d) * lag * (p.y - aim.y);
  camera.position.copy(camPos); camera.lookAt(aim);
  // focus pulls from the orb to the phone, a real lens move
  tmp.copy(p).lerp(V(-0.2, 1.0, 0.3), E.inOut(seg(t, 2.6, 3.2)) * (1 - d));
  bokeh.uniforms.focus.value = camera.position.distanceTo(tmp);

  drawOverlay(t);
  composer.render();
  renderer.autoClear = false; renderer.render(overScene, overCam); renderer.autoClear = true;
}

function voice(ctx, out, noise, c, when) {
  const p = c.pitch || 1, g = ctx.createGain(), pan = ctx.createStereoPanner();
  pan.pan.value = c.pan || 0; g.connect(pan); pan.connect(out);
  const env = (a, peak, d, at = when) => { g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(peak, at + a); g.gain.exponentialRampToValueAtTime(0.0001, at + a + d); };
  const osc = (type, f0, f1, dur, at = when) => { const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur); o.connect(g); o.start(at); o.stop(at + dur + 0.05); return o; };
  const hiss = (type, f, q, dur, at = when) => { const n = ctx.createBufferSource(); n.buffer = noise; const f2 = ctx.createBiquadFilter(); f2.type = type; f2.frequency.value = f; f2.Q.value = q; n.connect(f2); f2.connect(g); n.start(at); n.stop(at + dur); return f2; };
  const v = (c.gain ?? 0.6);
  switch (c.s) {
    case 'pop': env(0.004, v, 0.14); osc('sine', 700 * p, 260 * p, 0.12); break;
    case 'click': env(0.001, v, 0.05); hiss('highpass', 2500, 0.7, 0.03); osc('square', 1900 * p, 1200 * p, 0.02); break;
    case 'tick': env(0.001, v * 0.6, 0.04); osc('sine', 2300 * p, 2000 * p, 0.03); break;
    case 'glass': env(0.002, v * 0.7, 0.7); osc('sine', 2490 * p, 2484 * p, 0.7); osc('sine', 3960 * p, 3950 * p, 0.45); osc('sine', 5870 * p, 5860 * p, 0.25); break;
    case 'thud': env(0.003, v, 0.38); osc('sine', 110 * p, 42 * p, 0.3); hiss('lowpass', 500 * p, 0.8, 0.08); break;
    case 'whoosh': { const s0 = Math.max(0, when - 0.35), pk = Math.max(when, s0 + 0.05);
